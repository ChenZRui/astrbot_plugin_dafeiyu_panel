<!doctype html>
<html lang="zh-CN" data-skin="paper">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>主人教我的 · 大肥鱼面板</title>
<style>
  :root {
    --paper: #faf7f2; --card: #fffdfa; --line: #e8e0d4; --txt: #2b2620; --dim: #8b8175;
    --accent: #c9762f; --warnbg: #fdf3d8; --warnbd: #efdfae;
    --bg: #faf7f2; --card2: #f6f1e8; --acc: #c9762f; --acc2: #7aa2ff; --warn: #c9762f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--txt); }
  body { font: 15px/1.75 "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
         padding: 18px 18px 46px; overflow-x: hidden; }
  .wrap { max-width: 1120px; margin: 0 auto; }
  nav.pnav { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  nav.pnav a { color: var(--dim); text-decoration: none; font-size: 13px; border: 1px solid var(--line);
               background: var(--card); padding: 5px 12px; border-radius: 999px; }
  nav.pnav a.on { color: var(--bg); background: var(--txt); border-color: var(--txt); font-weight: 700; }
  h1 { font-size: 26px; margin: 6px 0 4px; }
  h1 i { color: var(--accent); font-style: normal; }
  .sub { color: var(--dim); font-size: 13.5px; margin-bottom: 16px; }

  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  .kpi b { display: block; font-size: 22px; line-height: 1.2; }
  .kpi span { color: var(--dim); font-size: 12.5px; }

  .bar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .search { flex: 1 1 240px; min-width: 180px; background: var(--card); border: 1px solid var(--line);
            border-radius: 12px; padding: 11px 14px; color: var(--txt); font-size: 14px; outline: none; }
  .search:focus { border-color: var(--accent); }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
  .tabs .addcat { border-style: dashed; color: var(--dim); }
  .tabs .addcat:hover { color: var(--acc); border-color: var(--acc); }
  .acts { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  .acts .sp { flex: 1; }
  .acts select, .acts button {
    background: var(--card2); color: var(--txt); border: 1px solid var(--line);
    border-radius: 9px; padding: 5px 10px; font-size: 12.5px; cursor: pointer; font-family: inherit;
  }
  .acts button.del { color: #ff8f8f; border-color: #4a2630; }
  .acts button.del:hover { background: #2a1720; }
  .acts button.ok { color: var(--acc); border-color: #1f4a3f; }
  .ctx { margin-top: 8px; }
  .ctx summary { cursor: pointer; color: var(--dim); font-size: 12.5px; }
  .ctx pre {
    white-space: pre-wrap; word-break: break-word; margin: 8px 0 0; padding: 10px 12px;
    background: var(--card2); border: 1px solid var(--line); border-radius: 10px;
    font: 12.5px/1.7 "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; color: var(--dim);
  }
  .toast {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 26px; z-index: 99;
    background: #16233a; color: var(--txt); border: 1px solid var(--line);
    border-radius: 10px; padding: 9px 16px; font-size: 13px; opacity: 0; transition: .25s;
    pointer-events: none; max-width: 80vw;
  }
  .toast.show { opacity: 1; }
  .tabs button { background: var(--card); border: 1px solid var(--line); color: var(--dim);
                 border-radius: 999px; padding: 7px 14px; font-size: 13px; cursor: pointer; }
  .tabs button.on { color: var(--bg); background: var(--txt); border-color: var(--txt); font-weight: 700; }

  .group { margin-bottom: 18px; }
  .group h2 { font-size: 15px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
  .group h2 em { font-style: normal; color: var(--dim); font-size: 12.5px; font-weight: 400; }
  .items { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .item { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
  .item .text { font-size: 14.5px; line-height: 1.7; }
  .item .meta { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .chip { background: var(--card2); border: 1px solid var(--line); border-radius: 999px;
          padding: 2px 9px; font-size: 12px; color: var(--dim); max-width: 100%;
          overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip.cat { color: #fff; border-color: transparent; }
  .cat-黑话 { background: #7aa2ff; }
  .cat-梗 { background: #f0994a; }
  .cat-调情 { background: #e86b9c; }
  .cat-其他 { background: #8b8175; }
  .empty { color: var(--dim); font-size: 13.5px; }

  .skins { position: fixed; right: 14px; top: 12px; z-index: 99; display: flex; gap: 6px;
           background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 4px 6px; }
  .skins button { border: 1px solid transparent; background: transparent; color: var(--dim);
                  font-size: 12px; padding: 3px 9px; border-radius: 999px; cursor: pointer; }
  .skins button.on { color: var(--bg); background: var(--txt); font-weight: 700; }

  html[data-skin="ocean"] {
    --bg: #0b0f19; --card: #111827; --card2: #0f172a; --line: #1f2b45;
    --txt: #e8eefc; --dim: #8b9ab5; --acc: #5ee1c1; --acc2: #7aa2ff; --warn: #ffcc66;
    --paper: #0b0f19; --accent: #5ee1c1; --warnbg: #16233a; --warnbd: #24406a;
  }
  html[data-skin="sakura"] {
    --paper: #fff5f7; --card: #ffffff; --card2: #ffeef2; --line: #ffd9e2;
    --txt: #3a2430; --dim: #9c7f8b; --accent: #e0567f; --warnbg: #fde9ef; --warnbd: #f2c9d7;
    --bg: #fff5f7; --acc: #e0567f; --acc2: #b06bff; --warn: #e08b00;
  }
  html[data-skin="forest"] {
    --paper: #0f1a14; --card: #16241b; --card2: #12201a; --line: #24402f;
    --txt: #e6f2e9; --dim: #8fae99; --accent: #7fdc9a; --warnbg: #1d2f22; --warnbd: #35553d;
    --bg: #0f1a14; --acc: #7fdc9a; --acc2: #57c7d4; --warn: #ffcc66;
  }

  @media (max-width: 900px) { .items { grid-template-columns: 1fr; } }
  @media (max-width: 560px) {
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    h1 { font-size: 22px; }
    .skins { position: static; margin: 0 0 10px; justify-content: flex-end; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="skins" id="skins">
    <button data-skin="paper">纸感</button>
    <button data-skin="ocean">深海</button>
    <button data-skin="sakura">樱花</button>
    <button data-skin="forest">森林</button>
  </div>

  <nav class="pnav">
    <a href="../她看过什么/index.html" data-nav="watch">她看过什么</a>
    <a href="../她的日记本/index.html" data-nav="journal">她的日记本</a>
    <a href="../主人画像/index.html" data-nav="profile">主人画像</a>
    <a href="#" class="on" data-nav="lessons">主人教我的</a>
  </nav>

  <h1>主人<i>教我的</i></h1>
  <div class="sub">你在 QQ 里教她的东西都在这里：黑话、梗、调情。可以直接说「记住，这是黑话：xxx」，她会自己归到对应分类。</div>

  <div class="kpis" id="kpis"></div>

  <div class="bar">
    <input class="search" id="q" placeholder="搜内容 / 分类……" />
    <div class="tabs" id="tabs"></div>
  </div>

  <div id="list"></div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
const bridge = window.AstrBotPluginView || window.AstrBotPluginPage;
let DATA = null;
let FILTER = "all";

let CATS = [];

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg || "";
  t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove("show"), 2200);
}

function srcLabel(src) {
  return src === "qq-chat" ? "聊天里教的" : src === "qq" ? "命令教的" : "日记里学的";
}

function buildTabs() {
  const box = document.getElementById("tabs");
  box.innerHTML = "";
  const mk = (key, label) => {
    const b = document.createElement("button");
    b.dataset.f = key;
    b.textContent = label;
    b.classList.toggle("on", FILTER === key);
    b.addEventListener("click", () => { FILTER = key; buildTabs(); render(); });
    box.appendChild(b);
    return b;
  };
  mk("all", "全部");
  for (const c of CATS) mk(c, c);
  const del = (DATA && DATA.trash) ? DATA.trash.length : 0;
  mk("trash", del ? `回收站 ${del}` : "回收站");
  const add = document.createElement("button");
  add.className = "addcat";
  add.textContent = "＋ 分类";
  add.title = "自己加一个分类，加完立刻生效";
  add.addEventListener("click", addCategory);
  box.appendChild(add);
}

async function addCategory() {
  const name = prompt("新分类叫什么？（例：游戏梗 / 主播梗 / 家里的事）");
  if (!name) return;
  try {
    const r = await bridge.apiPost("lessons/add_category", { name: name.trim() });
    const out = (r && r.data) ? r.data : (r || {});
    if (out.ok === false) { toast(out.message || "没加成"); return; }
    toast(out.message || "加好了");
    await load();
  } catch (e) { toast("加不上：" + e); }
}

function cardActions(it) {
  const row = document.createElement("div");
  row.className = "acts";
  const sel = document.createElement("select");
  sel.title = "换一个分类";
  for (const c of CATS) {
    const o = document.createElement("option");
    o.value = c; o.textContent = "归到：" + c;
    if (c === it.category) o.selected = true;
    sel.appendChild(o);
  }
  sel.addEventListener("change", async () => {
    try {
      const r = await bridge.apiPost("lessons/set_category", { id: it.id, category: sel.value });
      const out = (r && r.data) ? r.data : (r || {});
      toast(out.message || (out.ok ? "好了" : "没改成"));
      if (out.ok) await load();
    } catch (e) { toast("改不了：" + e); }
  });
  const sp = document.createElement("div"); sp.className = "sp";
  const del = document.createElement("button");
  del.className = "del"; del.textContent = "删除";
  del.addEventListener("click", async () => {
    if (!confirm("删掉这条？会先放进回收站，30 天内都能还原。")) return;
    try {
      const r = await bridge.apiPost("lessons/delete", { id: it.id });
      const out = (r && r.data) ? r.data : (r || {});
      toast(out.message || (out.ok ? "已删除" : "没删掉"));
      if (out.ok) await load();
    } catch (e) { toast("删不了：" + e); }
  });
  row.appendChild(sel);
  row.appendChild(sp);
  row.appendChild(del);
  return row;
}

function render() {
  const box = document.getElementById("list");
  if (!DATA) return;
  const q = (document.getElementById("q").value || "").trim().toLowerCase();
  box.innerHTML = "";
  let shown = 0;

  if (FILTER === "trash") {
    const rows = (DATA.trash || []).filter((t) => !q || (t.text || "").toLowerCase().includes(q));
    const wrap = document.createElement("div");
    wrap.className = "group";
    wrap.innerHTML = `<h2>回收站<em>${rows.length} 条 · 30 天后自动清掉</em></h2>`;
    const list = document.createElement("div");
    list.className = "items";
    for (const t of rows) {
      const d = document.createElement("div");
      d.className = "item";
      d.innerHTML = `<div class="text"></div><div class="meta">
        <span class="chip cat cat-${t.category}">${t.category}</span>
        <span class="chip">删于 ${t.deleted_ts || ""}</span>
        <span class="chip">还剩 ${t.days_left} 天</span></div>`;
      d.querySelector(".text").textContent = t.text;
      const row = document.createElement("div");
      row.className = "acts";
      const sp = document.createElement("div"); sp.className = "sp";
      const back = document.createElement("button");
      back.className = "ok"; back.textContent = "还原";
      back.addEventListener("click", async () => {
        try {
          const r = await bridge.apiPost("lessons/restore", { id: t.id });
          const out = (r && r.data) ? r.data : (r || {});
          toast(out.message || (out.ok ? "还原好了" : "还原失败"));
          if (out.ok) await load();
        } catch (e) { toast("还原不了：" + e); }
      });
      row.appendChild(sp); row.appendChild(back);
      d.appendChild(row);
      list.appendChild(d);
      shown++;
    }
    if (!shown) list.innerHTML = '<div class="empty">回收站是空的。</div>';
    wrap.appendChild(list);
    box.appendChild(wrap);
    return;
  }

  for (const g of (DATA.groups || [])) {
    if (FILTER !== "all" && g.category !== FILTER) continue;
    const items = (g.items || []).filter((it) => !q || (it.text || "").toLowerCase().includes(q)
      || (it.context || "").toLowerCase().includes(q));
    if (!items.length) continue;
    shown += items.length;
    const wrap = document.createElement("div");
    wrap.className = "group";
    wrap.innerHTML = `<h2>${g.category}<em>${items.length} 条</em></h2>`;
    const list = document.createElement("div");
    list.className = "items";
    for (const it of items) {
      const d = document.createElement("div");
      d.className = "item";
      const meta = [];
      if (it.source) meta.push(`<span class="chip">${srcLabel(it.source)}</span>`);
      if (it.day) meta.push(`<span class="chip">${it.day}</span>`);
      if (it.hits > 1) meta.push(`<span class="chip">说过 ${it.hits} 次</span>`);
      d.innerHTML = `<div class="text"></div><div class="meta">
        <span class="chip cat cat-${g.category}">${g.category}</span>${meta.join("")}</div>`;
      d.querySelector(".text").textContent = it.text;
      if (it.context) {
        const det = document.createElement("details");
        det.className = "ctx";
        det.innerHTML = "<summary>完整对话</summary><pre></pre>";
        det.querySelector("pre").textContent = it.context;
        d.appendChild(det);
      }
      d.appendChild(cardActions(it));
      list.appendChild(d);
    }
    wrap.appendChild(list);
    box.appendChild(wrap);
  }
  if (!shown) {
    const noFile = DATA.status && DATA.status.lessons_exists === false;
    box.innerHTML = noFile
      ? '<div class="empty">还没接过教学库：这个页面要配合「鲸鱼日记」插件用（她写日记时会自动收进去），也可以直接在 QQ 里教她。</div>'
      : '<div class="empty">还没有。在 QQ 里对她说「记住，这是黑话：……」就行。</div>';
  }
}

function kpis(d) {
  const c = d.counts || {};
  const cats = (d.categories || ["黑话", "梗", "调情"]);
  const cells = [["一共教的", (d.total || 0) + " 条"]];
  for (const k of cats.slice(0, 3)) cells.push([k, (c[k] || 0) + " 条"]);
  while (cells.length < 4) cells.push(["回收站", ((d.trash || []).length) + " 条"]);
  document.getElementById("kpis").innerHTML = cells
    .map(([k, v]) => `<div class="kpi"><b>${v}</b><span>${k}</span></div>`).join("");
}

async function load() {
  try {
    let d = await bridge.apiGet("lessons", {});
    if (d && d.data) d = d.data;
    DATA = d || {};
    CATS = DATA.categories || ["黑话", "梗", "调情", "其他"];
    kpis(DATA);
    buildTabs();
    render();
  } catch (e) {
    document.getElementById("list").innerHTML = /token|登录|Token/i.test(String(e && e.message || e))
          ? '<div class="empty">面板登录已过期：请重新登录 AstrBot 面板（右上角退出再登），然后刷新。</div>'
          : '<div class="empty">读取失败：' + e + '</div>';
  }
}

document.getElementById("q").addEventListener("input", () => render());
if (bridge) bridge.ready();
load();
</script>

<script>
(function () {
  var KEY = "dafeiyu-skin";
  var btns = document.querySelectorAll("#skins button");
  function apply(name) {
    document.documentElement.setAttribute("data-skin", name);
    btns.forEach(function (b) { b.classList.toggle("on", b.dataset.skin === name); });
    try { localStorage.setItem(KEY, name); } catch (e) {}
  }
  var saved = "paper";
  try { saved = localStorage.getItem(KEY) || "paper"; } catch (e) {}
  btns.forEach(function (b) { b.addEventListener("click", function () { apply(b.dataset.skin); }); });
  apply(saved);
})();
</script>
</body>
</html>

<!doctype html>
<html lang="zh-CN" data-skin="ocean">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>主人画像 · 大肥鱼面板</title>
<style>
  :root {
    --bg: #0b0f19; --card: #111827; --card2: #0f172a; --line: #1f2b45;
    --txt: #e8eefc; --dim: #8b9ab5; --acc: #5ee1c1; --acc2: #7aa2ff; --warn: #ffcc66;
    --paper: #f6f4ef; --accent: #2f9e83; --warnbg: #fdf3d8; --warnbd: #efdfae;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--txt); }
  body { font: 15px/1.7 "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
         padding: 18px 18px 46px; overflow-x: hidden; }
  .wrap { max-width: 1120px; margin: 0 auto; }
  nav.pnav { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  nav.pnav a { color: var(--dim); text-decoration: none; font-size: 13px; border: 1px solid var(--line);
               background: var(--card); padding: 5px 12px; border-radius: 999px; }
  nav.pnav a.on { color: var(--bg); background: var(--txt); border-color: var(--txt); font-weight: 700; }
  h1 { font-size: 26px; margin: 6px 0 4px; }
  h1 i { color: var(--acc); font-style: normal; }
  .sub { color: var(--dim); font-size: 13.5px; margin-bottom: 16px; }

  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 16px; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  .kpi b { display: block; font-size: 22px; line-height: 1.2; }
  .kpi span { color: var(--dim); font-size: 12.5px; }

  .mood { background: var(--card); border: 1px solid var(--line); border-radius: 16px;
          padding: 16px 18px; margin-bottom: 14px; }
  .mood .top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .mood .num { font-size: 34px; font-weight: 800; color: var(--acc); line-height: 1; }
  .mood .lab { font-size: 15px; }
  .mood .note { color: var(--dim); font-size: 13.5px; margin-top: 6px; }
  .bar { height: 10px; border-radius: 999px; background: var(--card2); border: 1px solid var(--line);
         margin-top: 12px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--acc), var(--acc2)); }

  .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }
  .box { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
  .box h3 { margin: 0 0 10px; font-size: 14px; color: var(--dim); font-weight: 600; letter-spacing: .3px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { background: var(--card2); border: 1px solid var(--line); border-radius: 999px;
          padding: 4px 11px; font-size: 13px; max-width: 100%; overflow: hidden;
          text-overflow: ellipsis; white-space: nowrap; }
  .chip.acc { border-color: var(--acc); color: var(--acc); }
  .empty { color: var(--dim); font-size: 13.5px; }
  .summary { background: var(--card); border: 1px solid var(--line); border-radius: 16px;
             padding: 16px 18px; margin-bottom: 14px; line-height: 1.85; }
  .summary h3 { margin: 0 0 8px; font-size: 14px; color: var(--dim); font-weight: 600; }
  .foot { color: var(--dim); font-size: 12.5px; margin-top: 6px; }

  .skins { position: fixed; right: 14px; top: 12px; z-index: 99; display: flex; gap: 6px;
           background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 4px 6px; }
  .skins button { border: 1px solid transparent; background: transparent; color: var(--dim);
                  font-size: 12px; padding: 3px 9px; border-radius: 999px; cursor: pointer; }
  .skins button.on { color: var(--bg); background: var(--txt); font-weight: 700; }

  html[data-skin="paper"] {
    --bg: #f6f4ef; --card: #ffffff; --card2: #f1ede6; --line: #e5ded1;
    --txt: #2b2620; --dim: #8b8175; --acc: #2f9e83; --acc2: #4b6bff; --warn: #c9762f;
    --paper: #f6f4ef; --accent: #2f9e83; --warnbg: #fdf3d8; --warnbd: #efdfae;
  }
  html[data-skin="sakura"] {
    --bg: #fff5f7; --card: #ffffff; --card2: #ffeef2; --line: #ffd9e2;
    --txt: #3a2430; --dim: #9c7f8b; --acc: #ff7aa2; --acc2: #b06bff; --warn: #e08b00;
    --paper: #fff5f7; --accent: #e0567f; --warnbg: #fde9ef; --warnbd: #f2c9d7;
  }
  html[data-skin="forest"] {
    --bg: #0f1a14; --card: #16241b; --card2: #12201a; --line: #24402f;
    --txt: #e6f2e9; --dim: #8fae99; --acc: #7fdc9a; --acc2: #57c7d4; --warn: #ffcc66;
    --paper: #0f1a14; --accent: #7fdc9a; --warnbg: #1d2f22; --warnbd: #35553d;
  }

  @media (max-width: 900px) { .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 560px) {
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .cards { grid-template-columns: 1fr; }
    h1 { font-size: 22px; }
    .skins { position: static; margin: 0 0 10px; justify-content: flex-end; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="skins" id="skins">
    <button data-skin="ocean">深海</button>
    <button data-skin="paper">纸感</button>
    <button data-skin="sakura">樱花</button>
    <button data-skin="forest">森林</button>
  </div>

  <nav class="pnav">
    <a href="../她看过什么/index.html" data-nav="watch">她看过什么</a>
    <a href="../她的日记本/index.html" data-nav="journal">她的日记本</a>
    <a href="#" class="on" data-nav="profile">主人画像</a>
    <a href="../主人教我的/index.html" data-nav="lessons">主人教我的</a>
  </nav>

  <h1>她眼里的<i>主人</i></h1>
  <div class="sub">她根据最近的聊天，自己总结的你：性格、生活习惯、口头禅、心情指数、睡眠状态。</div>

  <div class="kpis" id="kpis"></div>

  <div class="mood" id="mood">
    <div class="top">
      <div class="num" id="moodNum">—</div>
      <div class="lab" id="moodLab">还没算过</div>
    </div>
    <div class="bar"><i id="moodBar" style="width:0%"></i></div>
    <div class="note" id="moodNote"></div>
  </div>

  <div class="cards">
    <div class="box"><h3>性格</h3><div class="chips" id="personality"></div></div>
    <div class="box"><h3>生活习惯</h3><div class="chips" id="habits"></div></div>
    <div class="box"><h3>口头禅</h3><div class="chips" id="catchphrases"></div></div>
  </div>

  <div class="summary">
    <h3>她写下的总结</h3>
    <div id="summary" class="empty">还没有。</div>
    <div class="foot" id="foot"></div>
  </div>
</div>

<script type="module">
const bridge = window.AstrBotPluginView || window.AstrBotPluginPage;

function el(id) { return document.getElementById(id); }
function chips(node, list, cls) {
  node.innerHTML = "";
  if (!list || !list.length) { node.innerHTML = '<span class="empty">还没有</span>'; return; }
  list.forEach((t) => {
    const s = document.createElement("span");
    s.className = "chip" + (cls ? " " + cls : "");
    s.textContent = t;
    node.appendChild(s);
  });
}

async function load() {
  let d = {};
  try {
    d = await bridge.apiGet("profile");
  } catch (e) {
    el("summary").textContent = /token|登录|Token/i.test(String(e && e.message || e))
          ? "面板登录已过期：请重新登录 AstrBot 面板（右上角退出再登），然后刷新。"
          : "读取失败：" + e;
    return;
  }
  if (d && d.data) d = d.data;
  const mood = d.mood || {}, sleep = d.sleep || {};
  el("kpis").innerHTML = [
    ["心情指数", (mood.index || 0) + "/10"],
    ["睡眠", sleep.quality || "—"],
    ["算过几天", (d.days_covered || 0) + " 天"],
    ["更新时间", d.updated_at || "—"],
  ].map(([k, v]) => `<div class="kpi"><b>${v}</b><span>${k}</span></div>`).join("");

  el("moodNum").textContent = d.has_data ? (mood.index || 0) : "—";
  el("moodLab").textContent = d.has_data ? (mood.label || "—") : "还没算过";
  el("moodBar").style.width = (Math.max(0, Math.min(10, mood.index || 0)) * 10) + "%";
  const noFile = d.status && d.status.profile_exists === false;
  el("moodNote").textContent = d.has_data
    ? (mood.note || "")
    : (noFile
        ? "还没生成过画像：这个页面要配合「鲸鱼日记」插件用（她写完日记会自动总结你），也可以让主人在 QQ 发 /主人画像 先算一次。"
        : "多跟她聊几句，她会自己总结你。");

  chips(el("personality"), d.personality, "acc");
  chips(el("habits"), d.habits);
  chips(el("catchphrases"), d.catchphrases);
  el("summary").textContent = d.summary || "还没有。";
  el("summary").className = d.summary ? "" : "empty";
  el("foot").textContent = d.has_data
    ? `（更新于 ${d.updated_at || "—"}，覆盖 ${d.days_covered || 0} 天聊天；睡眠：${sleep.note || sleep.quality || "—"}）`
    : "";
}

if (bridge) bridge.ready();
load();
</script>

<script>
(function () {
  var KEY = "dafeiyu-skin";
  var btns = document.querySelectorAll("#skins button");
  function apply(name) {
    document.documentElement.setAttribute("data-skin", name);
    btns.forEach(function (b) { b.classList.toggle("on", b.dataset.skin === name); });
    try { localStorage.setItem(KEY, name); } catch (e) {}
  }
  var saved = "ocean";
  try { saved = localStorage.getItem(KEY) || "ocean"; } catch (e) {}
  btns.forEach(function (b) { b.addEventListener("click", function () { apply(b.dataset.skin); }); });
  apply(saved);
})();
</script>
</body>
</html>

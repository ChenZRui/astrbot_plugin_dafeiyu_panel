<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>她的日记本 · 大肥鱼面板</title>
<style>
  :root {
    --paper: #faf7f2;
    --card: #fffdfa;
    --line: #e8e0d4;
    --txt: #2b2620;
    --dim: #8b8175;
    --accent: #c9762f;
    --warnbg: #fdf3d8;
    --warnbd: #efdfae;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--txt); }
  body { font: 15px/1.75 "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
         padding: 18px 18px 46px; overflow-x: hidden; }
  .wrap { max-width: 1120px; margin: 0 auto; }
  nav.pnav { display: flex; gap: 8px; margin-bottom: 12px; }
  nav.pnav a { color: var(--dim); text-decoration: none; font-size: 13px; border: 1px solid var(--line);
               background: var(--card); padding: 5px 12px; border-radius: 999px; }
  nav.pnav a.on { color: var(--bg); background: var(--txt); border-color: var(--txt); font-weight: 700; }
  h1 { font-size: 26px; margin: 6px 0 6px; }
  .sub { color: var(--dim); font-size: 13.5px; margin-bottom: 14px; }
  .kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; margin: 14px 0 16px; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  .kpi b { display: block; font-size: 20px; line-height: 1.25; }
  .kpi span { color: var(--dim); font-size: 12.5px; }
  .search { width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 12px;
            padding: 11px 14px; color: var(--txt); font-size: 14px; outline: none; margin-bottom: 16px; }
  .search:focus { border-color: var(--accent); }
  .layout { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 22px; align-items: start; }
  .toc { position: sticky; top: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
  .toc h3 { margin: 0 0 8px; font-size: 13px; color: var(--dim); font-weight: 600; }
  .toc a { display: flex; justify-content: space-between; gap: 8px; text-decoration: none; color: var(--txt);
           font-size: 13px; padding: 6px 8px; border-radius: 8px; }
  .toc a:hover, .toc a.on { background: var(--warnbg); }
  .toc a span { color: var(--dim); font-size: 12px; }

  .day { margin-bottom: 26px; }
  .dayh { color: var(--txt); font-size: 15px; font-weight: 700; margin: 0 0 10px; display: flex; gap: 10px; align-items: baseline; }
  .dayh span { color: var(--dim); font-weight: 400; font-size: 13px; }
  .entry { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; margin-bottom: 16px; }
  .head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .pill { background: #eef7f3; color: #2f7a5f; border-radius: 999px; padding: 3px 12px; font-size: 12.5px; font-weight: 600; }
  .pill.m2 { background: #fdeef2; color: #9c3b5c; }
  .pill.m3 { background: #fff3e2; color: #a26518; }
  .pill.m4 { background: #eef0fb; color: #47539c; }
  .pill.m5 { background: #f6eefb; color: #7b3f9e; }
  .hm { color: var(--dim); font-size: 12.5px; }
  .etitle { font-size: 17px; font-weight: 700; margin: 2px 0 10px; }
  .body { white-space: pre-wrap; font-size: 15px; }
  .lessons { background: var(--warnbg); border: 1px solid var(--warnbd); border-radius: 12px; padding: 12px 14px; margin: 14px 0 0; }
  .lessons h4 { margin: 0 0 6px; font-size: 13px; color: var(--warn); }
  .lessons ul { margin: 0; padding-left: 18px; }
  .lessons li { font-size: 14px; }
  .vids { margin-top: 14px; }
  .vids h4 { margin: 0 0 6px; font-size: 13px; color: var(--dim); }
  .vids ul { margin: 0; padding-left: 18px; }
  .vids li { font-size: 14px; margin: 2px 0; color: var(--txt); }
  .meta { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { background: var(--card2); color: var(--dim); border-radius: 8px; padding: 2px 9px; font-size: 12px; }
  .empty { color: var(--dim); text-align: center; padding: 40px 0; }
  .hintbox { background: var(--card); border: 1px dashed var(--line); border-radius: 14px; padding: 14px 16px; color: var(--dim); font-size: 13.5px; }
  .hintbox code { color: var(--accent); }
  .toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); opacity: 0;
           background: #2b2620; color: #fff; padding: 11px 18px; border-radius: 12px; font-size: 13.5px;
           pointer-events: none; transition: .2s; }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; }
    .toc { position: static; display: flex; gap: 8px; overflow-x: auto; padding: 10px; }
    .toc h3 { display: none; }
    .toc a { flex: 0 0 auto; border: 1px solid var(--line); }
  }
  @media (max-width: 560px) {
    body { padding: 14px 12px 40px; }
    h1 { font-size: 21px; }
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    body { overflow-x: hidden; }
    .tabs { flex-wrap: wrap; }
    .tabs button { padding: 6px 11px; font-size: 12px; }
    .card .meta .chip { max-width: 100%; }
    .entry { padding: 15px 16px; }
    .etitle { font-size: 16px; }
  }

  /* ------------------------------------------------ 皮肤（右上角切换） */
  .skins { position: fixed; right: 14px; top: 12px; z-index: 99; display: flex; gap: 6px;
           background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 4px 6px; }
  .skins button { border: 1px solid transparent; background: transparent; color: var(--dim);
                  font-size: 12px; padding: 3px 9px; border-radius: 999px; cursor: pointer; }
  .skins button.on { color: var(--bg); background: var(--txt); font-weight: 700; }
  @media (max-width: 560px) { .skins { position: static; margin: 0 0 10px; justify-content: flex-end; } }

  html[data-skin="paper"] {
    --bg: #f6f4ef; --card: #ffffff; --card2: #f1ede6; --line: #e5ded1;
    --txt: #2b2620; --dim: #8b8175; --acc: #2f9e83; --acc2: #4b6bff; --warn: #c9762f;
    --paper: #f6f4ef; --accent: #2f9e83; --warnbg: #fdf3d8; --warnbd: #efdfae;
  }
  html[data-skin="sakura"] {
    --bg: #fff5f7; --card: #ffffff; --card2: #ffeef2; --line: #ffd9e2;
    --txt: #3a2430; --dim: #9c7f8b; --acc: #ff7aa2; --acc2: #b06bff; --warn: #e08b00;
    --paper: #fff5f7; --accent: #e0567f; --warnbg: #fde9ef; --warnbd: #f2c9d7;
  }
  html[data-skin="forest"] {
    --bg: #0f1a14; --card: #16241b; --card2: #12201a; --line: #24402f;
    --txt: #e6f2e9; --dim: #8fae99; --acc: #7fdc9a; --acc2: #57c7d4; --warn: #ffcc66;
    --paper: #0f1a14; --accent: #7fdc9a; --warnbg: #1d2f22; --warnbd: #35553d;
  }
  html[data-skin="ocean"] {
    --bg: #0b0f19; --card: #111827; --card2: #0f172a; --line: #1f2b45;
    --txt: #e8eefc; --dim: #8b9ab5; --acc: #5ee1c1; --acc2: #7aa2ff; --warn: #ffcc66;
    --paper: #0b0f19; --accent: #5ee1c1; --warnbg: #1b2436; --warnbd: #2c3a55;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="skins" id="skins">
    <button data-skin="ocean">深海</button>
    <button data-skin="paper">纸感</button>
    <button data-skin="sakura">樱花</button>
    <button data-skin="forest">森林</button>
  </div>

    <nav class="pnav">
    <a href="../她看过什么/index.html" data-nav="watch">她看过什么</a>
    <a href="#" class="on" data-nav="journal">她的日记本</a>
    <a href="../主人画像/index.html" data-nav="profile">主人画像</a>
    <a href="../主人教我的/index.html" data-nav="lessons">主人教我的</a>
  </nav>

  <h1>大肥鱼的日记本</h1>
  <div class="sub">她自己写的小本子：跟主人聊了什么、被教了什么、B站上刷到了什么。</div>

  <div class="kpis" id="kpis"></div>
  <input class="search" id="q" placeholder="搜日记正文 / 心情 / 视频 / 主人教我的事……" />

  <div class="layout">
    <aside class="toc" id="toc"><h3>按天翻</h3></aside>
    <main id="feed"></main>
  </div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
const bridge = window.AstrBotPluginView || window.AstrBotPluginPage;
const el = (id) => document.getElementById(id);
const toastEl = el('toast');
let timer = null;
function say(msg) { toastEl.textContent = msg; toastEl.className = 'toast on'; clearTimeout(timer); timer = setTimeout(() => toastEl.className = 'toast', 2400); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function dayLabel(day) {
  if (!day) return '未知日期';
  const d = new Date(day + 'T00:00:00');
  const w = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'][d.getDay()];
  return day + ' ' + w;
}
function moodClass(i) { return 'pill' + (i % 3 === 0 ? '' : i % 3 === 1 ? ' m2' : ' m3'); }

async function apiGet(endpoint, params) {
  if (!bridge) throw new Error('没有找到 AstrBot 面板桥接（请从 WebUI 插件页打开这个视图）');
  await bridge.ready();
  return bridge.apiGet(endpoint, params || {});
}

function render(data) {
  const entries = data.entries || [];
  const lessons = entries.reduce((n, e) => n + (e.lessons || []).length, 0);
  const days = data.days || [];
  const kpis = [
    [entries.length, '一共记了'],
    [days.length, '记了几天'],
    [lessons, '主人教过的事'],
    [entries[0] ? entries[0].mood || '—' : '—', '最近心情'],
    [entries[0] ? entries[0].day : '—', '最近一篇'],
  ];
  el('kpis').innerHTML = kpis.map(([v, k]) => `<div class="kpi"><b>${esc(v)}</b><span>${esc(k)}</span></div>`).join('');

  el('toc').innerHTML = '<h3>按天翻</h3>' + days.map((d) =>
    `<a href="#d-${esc(d.day)}" data-day="${esc(d.day)}">${esc(dayLabel(d.day))}<span>${d.n} 篇</span></a>`).join('');

  const groups = [];
  entries.forEach((e) => {
    const day = e.day || '';
    if (!groups.length || groups[groups.length - 1].day !== day) groups.push({ day, rows: [] });
    groups[groups.length - 1].rows.push(e);
  });

  el('feed').innerHTML = groups.map((g) => {
    const rows = g.rows.map((e, i) => {
      const chips = [];
      if (e.chat_count) chips.push(`<span class="chip">${e.chat_count} 句对话</span>`);
      if (e.span && e.span[1]) chips.push(`<span class="chip">${esc(e.span[0])}–${esc(e.span[1])}</span>`);
      const lessonsHtml = (e.lessons && e.lessons.length)
        ? `<div class="lessons"><h4>主人教我的</h4><ul>${e.lessons.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></div>` : '';
      const vidsHtml = (e.videos && e.videos.length)
        ? `<div class="vids"><h4>看了</h4><ul>${e.videos.map((v) => `<li>${esc(v)}</li>`).join('')}</ul></div>` : '';
      return `
      <article class="entry">
        <div class="head">
          ${e.mood ? `<span class="${moodClass(i)}">心情 · ${esc(e.mood)}</span>` : ''}
          ${e.hm ? `<span class="hm">${esc(e.hm)}</span>` : ''}
        </div>
        ${e.title ? `<div class="etitle">${esc(e.title)}</div>` : ''}
        <div class="body">${esc(e.body)}</div>
        ${lessonsHtml}
        ${vidsHtml}
        ${chips.length ? `<div class="meta">${chips.join('')}</div>` : ''}
      </article>`;
    }).join('');
    return `<section class="day" id="d-${esc(g.day)}"><h2 class="dayh">${esc(dayLabel(g.day))}<span>${g.rows.length} 篇</span></h2>${rows}</section>`;
  }).join('');

  if (!entries.length) {
    const st = data.status || {};
    el('feed').innerHTML = '<div class="hintbox">还没有日记：没找到 <code>' + esc(st.journal_file || 'data/whale_journal/entries.jsonl') +
      '</code>。<br>装上「大肥鱼日记本」插件（astrbot_plugin_whale_journal），她写完第一篇这里就有了。</div>';
  }

  el('toc').querySelectorAll('a').forEach((a) => {
    a.addEventListener('click', (ev) => {
      ev.preventDefault();
      const target = document.getElementById('d-' + a.dataset.day);
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      el('toc').querySelectorAll('a').forEach((x) => x.classList.toggle('on', x === a));
    });
  });
}

let qTimer = null;
async function load() {
  try {
    const data = await apiGet('journal', { q: el('q').value.trim(), limit: 300 });
    render(data);
  } catch (e) {
    say(/token|登录|Token/i.test(String(e && e.message || e))
          ? '面板登录已过期：请重新登录 AstrBot 面板，然后刷新。'
          : '加载失败：' + e.message);
  }
}
el('q').addEventListener('input', () => { clearTimeout(qTimer); qTimer = setTimeout(load, 320); });
document.querySelectorAll('nav.pnav a').forEach((a) => {
  a.addEventListener('click', (ev) => {
    ev.preventDefault();
    if (a.dataset.nav === 'watch') location.href = '../她看过什么/index.html';
  });
});
load();
</script>

<script>
(function () {
  var KEY = "dafeiyu-skin";
  var btns = document.querySelectorAll("#skins button");
  function apply(name) {
    document.documentElement.setAttribute("data-skin", name);
    btns.forEach(function (b) { b.classList.toggle("on", b.dataset.skin === name); });
    try { localStorage.setItem(KEY, name); } catch (e) {}
  }
  var saved = "ocean";
  try { saved = localStorage.getItem(KEY) || "ocean"; } catch (e) {}
  btns.forEach(function (b) { b.addEventListener("click", function () { apply(b.dataset.skin); }); });
  apply(saved);
})();
</script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>她看过什么 · 大肥鱼面板</title>
<style>
  :root {
    --bg: #0b0f19;
    --card: #111827;
    --card2: #0f172a;
    --line: #1f2b45;
    --txt: #e8eefc;
    --dim: #8b9ab5;
    --acc: #5ee1c1;
    --acc2: #7aa2ff;
    --warn: #ffcc66;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--txt); }
  body {
    font: 15px/1.6 "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    padding: 18px 18px 40px;
    overflow-x: hidden;
  }
  .wrap { max-width: 1180px; margin: 0 auto; }
  h1 { font-size: 26px; margin: 4px 0 6px; letter-spacing: .5px; }
  h1 i { color: var(--acc); font-style: normal; }
  .sub { color: var(--dim); font-size: 13.5px; margin-bottom: 14px; }

  .kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; margin: 14px 0; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  .kpi b { display: block; font-size: 22px; line-height: 1.2; }
  .kpi span { color: var(--dim); font-size: 12.5px; }

  .bar { display: flex; gap: 10px; align-items: center; margin: 14px 0 10px; flex-wrap: wrap; }
  .search { flex: 1 1 240px; min-width: 180px; background: var(--card); border: 1px solid var(--line);
            border-radius: 12px; padding: 11px 14px; color: var(--txt); font-size: 14px; outline: none; }
  .search:focus { border-color: var(--acc2); }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
  .tabs button { background: var(--card2); border: 1px solid var(--line); color: var(--dim);
                 border-radius: 999px; padding: 7px 14px; font-size: 13.5px; cursor: pointer; }
  .tabs button.on { background: linear-gradient(90deg, var(--acc), var(--acc2)); color: #08131a;
                    border-color: transparent; font-weight: 700; }
  .tabs button.fav.on { background: #ffcf6b; }

  .dayh { display: flex; align-items: baseline; gap: 10px; margin: 22px 0 10px; font-size: 15px; font-weight: 700; }
  .dayh span { color: var(--dim); font-weight: 400; font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden;
          display: flex; flex-direction: column; }
  .cvbox { position: relative; aspect-ratio: 16 / 10; background: #0d1526; }
  .cvbox img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cvbox .ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
               color: #4d5b76; font-size: 13px; text-align: center; padding: 0 18px; line-height: 1.5; }
  .no { position: absolute; left: 10px; top: 10px; background: rgba(8, 14, 26, .8); border: 1px solid var(--line);
        border-radius: 8px; padding: 2px 8px; font-size: 12px; color: var(--acc); }
  .body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; }
  .title { font-size: 14.5px; font-weight: 700; line-height: 1.45; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { background: #16203a; border: 1px solid var(--line); color: var(--dim); border-radius: 8px;
          padding: 2px 8px; font-size: 12px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip.hot { color: #08131a; background: var(--acc); border-color: transparent; font-weight: 700; }
  .chip.tag { color: #9cc3ff; }
  .chip.mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; }

  .rate { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .stars { display: flex; gap: 2px; font-size: 19px; color: #3a4763; user-select: none; }
  .stars .st { cursor: pointer; transition: color .12s; }
  .stars .st.on { color: var(--warn); }
  .tip { color: var(--dim); font-size: 12px; }
  .favbtn { margin-left: auto; background: var(--card2); border: 1px solid var(--line); color: var(--dim);
            border-radius: 999px; padding: 5px 11px; font-size: 12.5px; cursor: pointer; }
  .favbtn.on { background: #ffcf6b; color: #3a2a00; border-color: transparent; font-weight: 700; }
  textarea { width: 100%; background: var(--card2); border: 1px solid var(--line); border-radius: 10px;
             color: var(--txt); padding: 9px 11px; font: inherit; font-size: 13.5px; resize: vertical; outline: none; }
  textarea:focus { border-color: var(--acc2); }
  .foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 12px; color: var(--dim); }
  .foot a { color: var(--acc2); text-decoration: none; }
  .stat.saved { color: var(--acc); }
  .stat.err { color: #ff7b7b; }

  .more { display: flex; justify-content: center; margin: 26px 0 8px; }
  .more button { background: var(--card); border: 1px solid var(--line); color: var(--txt);
                 border-radius: 999px; padding: 12px 30px; font-size: 14px; cursor: pointer; }
  .more button:hover { border-color: var(--acc2); }
  .empty { color: var(--dim); text-align: center; padding: 40px 0; }
  .hintbox { background: #101b2e; border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px;
             color: var(--dim); font-size: 13px; margin: 12px 0; }
  .hintbox code { color: var(--acc); }
  .toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); opacity: 0;
           background: #16203a; border: 1px solid var(--line); color: var(--txt); padding: 11px 18px;
           border-radius: 12px; font-size: 13.5px; pointer-events: none; transition: .2s; max-width: 80vw; }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }

  nav.pnav { display: flex; gap: 8px; margin-bottom: 10px; }
  nav.pnav a { color: var(--dim); text-decoration: none; font-size: 13px; border: 1px solid var(--line);
               padding: 5px 12px; border-radius: 999px; }
  nav.pnav a.on { color: #08131a; background: var(--acc); border-color: transparent; font-weight: 700; }

  @media (max-width: 900px) {
    .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
  @media (max-width: 560px) {
    body { padding: 14px 12px 34px; }
    h1 { font-size: 21px; }
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid { grid-template-columns: 1fr; }
    .kpi b { font-size: 19px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <nav class="pnav">
    <a href="#" class="on" data-nav="watch">她看过什么</a>
    <a href="#" data-nav="journal">她的日记本</a>
  </nav>

  <h1>她看过<i>什么</i></h1>
  <div class="sub">点星星打分、写两句评价、点收藏，都会直接存回服务器；她下一轮选题按这个调权重。</div>

  <div class="kpis" id="kpis"></div>

  <div class="bar">
    <input class="search" id="q" placeholder="搜标题 / 主题 / 你写的评价……" />
  </div>
  <div class="tabs" id="tabs">
    <button data-f="all" class="on">全部</button>
    <button data-f="shared">她推给我的</button>
    <button data-f="unshared">没推给我的</button>
    <button data-f="fav" class="fav">收藏</button>
    <button data-f="todo">待我评价</button>
    <button data-f="done">评过的</button>
  </div>

  <div id="feed"></div>
  <div class="empty" id="empty" style="display:none">这儿没有内容。</div>
  <div class="more" id="more" style="display:none"><button id="moreBtn">再看一页</button></div>

  <footer style="margin-top:26px;color:#54617c;font-size:12.5px">
    大肥鱼面板 · 数据来自刷B站插件与日记插件 · 打分保存在本插件 data 目录并同步给刷B站插件
  </footer>
</div>
<div class="toast" id="toast"></div>

<script type="module">
const bridge = window.AstrBotPluginView || window.AstrBotPluginPage;
const state = { filter: 'all', q: '', page: 1, pages: 1, items: [], allowEdit: true, loading: false };
const el = (id) => document.getElementById(id);
const toastEl = el('toast');
let toastTimer = null;
function say(msg) {
  toastEl.textContent = msg;
  toastEl.className = 'toast on';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toastEl.className = 'toast'; }, 2200);
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function dayLabel(day) {
  if (!day) return '未知日期';
  const d = new Date(day + 'T00:00:00');
  const w = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'][d.getDay()];
  return day + ' ' + w;
}

async function apiGet(endpoint, params) {
  if (!bridge) throw new Error('没有找到 AstrBot 面板桥接（请从 WebUI 插件页打开这个视图）');
  await bridge.ready();
  return bridge.apiGet(endpoint, params || {});
}
async function apiPost(endpoint, body) {
  if (!bridge) throw new Error('没有找到 AstrBot 面板桥接');
  await bridge.ready();
  return bridge.apiPost(endpoint, body || {});
}

function renderKpis(s) {
  const rows = [
    [s.total, '看过的视频'],
    [s.rated, '已打分'],
    [s.fav, '收藏 / 五星'],
    [s.shared, '推给我的'],
    [s.avg || '0.0', '平均星级'],
    [s.days, '有记录的天数'],
  ];
  el('kpis').innerHTML = rows.map(([v, k]) => `<div class="kpi"><b>${esc(v)}</b><span>${esc(k)}</span></div>`).join('');
}

function cardHtml(it, idx) {
  const stars = [1, 2, 3, 4, 5].map((s) =>
    `<span class="st${s <= it.stars ? ' on' : ''}" data-s="${s}">★</span>`).join('');
  const chips = [];
  if (it.hm) chips.push(`<span class="chip">${esc(it.hm)}</span>`);
  if (it.score) chips.push(`<span class="chip">她给 ${esc(it.score)} 分</span>`);
  if (it.shared) chips.push('<span class="chip hot">推给我过</span>');
  if (it.keyword) chips.push(`<span class="chip tag">#${esc(String(it.keyword).slice(0, 22))}</span>`);
  chips.push(`<span class="chip mono">${esc(it.bvid)}</span>`);
  const fav = it.fav;
  return `
  <article class="card" data-bvid="${esc(it.bvid)}" data-stars="${it.stars}" data-fav="${fav ? 1 : 0}"
           data-q="${esc((it.title + ' ' + it.note + ' ' + it.keyword).toLowerCase())}">
    <div class="cvbox">
      <div class="ph" data-ph>${it.cover ? '封面加载中…' : '视频已不可见 / B站取不到封面'}</div>
      <img alt="" data-cv style="display:none" />
      <span class="no">#${idx}</span>
    </div>
    <div class="body">
      <div class="title">${esc(it.title)}</div>
      <div class="chips">${chips.join('')}</div>
      <div class="rate">
        <div class="stars" role="radiogroup" aria-label="打分">${stars}</div>
        <span class="tip">点星星打分</span>
        <button class="favbtn${fav ? ' on' : ''}" data-fav-btn>${fav ? '★ 已收藏' : '☆ 收藏'}</button>
      </div>
      <textarea class="note" rows="2" placeholder="想对她说点什么？比如「这种多推」「别再刷这个了」">${esc(it.note)}</textarea>
      <div class="foot">
        <span class="stat">${it.stars ? '已打分' : '待你评价'}</span>
        <a href="https://www.bilibili.com/video/${esc(it.bvid)}" target="_blank" rel="noreferrer">去B站打开 ▶</a>
      </div>
    </div>
  </article>`;
}

function renderFeed(append) {
  const groups = [];
  state.items.forEach((it) => {
    const day = it.day || '';
    if (!groups.length || groups[groups.length - 1].day !== day) groups.push({ day, rows: [] });
    groups[groups.length - 1].rows.push(it);
  });
  let idx = append ? document.querySelectorAll('#feed .card').length : 0;
  const html = groups.map((g) => {
    const cards = g.rows.map((it) => cardHtml(it, ++idx)).join('');
    return `<section class="dayblock" id="d-${esc(g.day)}"><h2 class="dayh">${esc(dayLabel(g.day))}<span>· ${g.rows.length} 条</span></h2><div class="grid">${cards}</div></section>`;
  }).join('');
  if (append) el('feed').insertAdjacentHTML('beforeend', html);
  else el('feed').innerHTML = html;
  loadCovers(append ? document.querySelectorAll('#feed .card:not([data-cv-done])') : document.querySelectorAll('#feed .card'));
}

async function loadCovers(cards) {
  for (const card of Array.from(cards)) {
    const bvid = card.dataset.bvid;
    card.dataset.cvDone = '1';
    const img = card.querySelector('[data-cv]');
    const ph = card.querySelector('[data-ph]');
    try {
      const r = await apiGet('cover', { bvid });
      if (r && r.data) {
        img.src = 'data:image/jpeg;base64,' + r.data;
        img.style.display = '';
        if (ph) ph.style.display = 'none';
      } else if (ph) {
        ph.textContent = '视频已不可见 / B站取不到封面';
      }
    } catch (e) {
      if (ph) ph.textContent = '封面取不到';
    }
  }
}

async function load(reset) {
  if (state.loading) return;
  state.loading = true;
  try {
    if (reset) { state.page = 1; state.items = []; }
    const data = await apiGet('items', { filter: state.filter, q: state.q, page: state.page, size: 24 });
    state.pages = data.pages || 1;
    state.allowEdit = data.allow_edit !== false;
    state.items = reset ? data.items : state.items.concat(data.items);
    renderKpis(data.summary || {});
    const status = data.status || {};
    if (!status.state_exists) {
      el('feed').innerHTML = '<div class="hintbox">还没有数据：没找到 <code>' + esc(status.state_file || 'data/bili_whale/state.json') +
        '</code>。装上「刷B站的大肥鱼」插件、她刷过视频之后这里就自动有内容了。</div>';
    } else {
      renderFeed(!reset);
      el('empty').style.display = data.items.length ? 'none' : '';
    }
    el('more').style.display = state.page < state.pages ? '' : 'none';
    if (!state.allowEdit) {
      el('feed').querySelectorAll('.stars .st, .favbtn, textarea').forEach((n) => { n.style.pointerEvents = 'none'; n.style.opacity = '.6'; });
    }
  } catch (e) {
    say('加载失败：' + e.message);
  } finally {
    state.loading = false;
  }
}

async function save(card) {
  const stat = card.querySelector('.stat');
  if (stat) { stat.textContent = '保存中…'; stat.className = 'stat'; }
  const body = {
    bvid: card.dataset.bvid,
    stars: parseInt(card.dataset.stars || '0', 10),
    fav: card.dataset.fav === '1',
    note: (card.querySelector('.note') || {}).value || '',
  };
  try {
    const r = await apiPost('rate', body);
    if (stat) { stat.textContent = r.synced ? '已保存（她会看到）' : '已保存'; stat.className = 'stat saved'; }
    card.dataset.q = ((card.querySelector('.title') || {}).textContent || '').toLowerCase() + ' ' + body.note.toLowerCase();
  } catch (e) {
    if (stat) { stat.textContent = '保存失败'; stat.className = 'stat err'; }
    say('保存失败：' + e.message);
  }
}

el('feed').addEventListener('click', (ev) => {
  const st = ev.target.closest('.st');
  if (st) {
    const card = st.closest('.card');
    const s = parseInt(st.dataset.s, 10);
    const cur = parseInt(card.dataset.stars || '0', 10);
    const val = cur === s ? 0 : s;
    card.dataset.stars = val;
    card.querySelectorAll('.st').forEach((x) => x.classList.toggle('on', parseInt(x.dataset.s, 10) <= val));
    if (val >= 5) { card.dataset.fav = '1'; const b = card.querySelector('[data-fav-btn]'); b.classList.add('on'); b.textContent = '★ 已收藏'; }
    save(card);
    return;
  }
  const fb = ev.target.closest('[data-fav-btn]');
  if (fb) {
    const card = fb.closest('.card');
    const on = card.dataset.fav !== '1';
    card.dataset.fav = on ? '1' : '0';
    fb.classList.toggle('on', on);
    fb.textContent = on ? '★ 已收藏' : '☆ 收藏';
    save(card);
  }
});
el('feed').addEventListener('blur', (ev) => {
  if (ev.target.classList && ev.target.classList.contains('note')) save(ev.target.closest('.card'));
}, true);
el('q').addEventListener('input', () => {
  clearTimeout(window.__qT);
  window.__qT = setTimeout(() => { state.q = el('q').value.trim(); load(true); }, 300);
});
el('tabs').addEventListener('click', (ev) => {
  const b = ev.target.closest('button');
  if (!b) return;
  el('tabs').querySelectorAll('button').forEach((x) => x.classList.remove('on'));
  b.classList.add('on');
  state.filter = b.dataset.f;
  load(true);
});
el('moreBtn').addEventListener('click', () => { state.page += 1; load(false); });
document.querySelectorAll('nav.pnav a').forEach((a) => {
  a.addEventListener('click', async (ev) => {
    ev.preventDefault();
    if (a.dataset.nav === 'journal') { location.href = '../她的日记本/index.html'; }
    else { document.querySelectorAll('nav.pnav a').forEach((x) => x.classList.remove('on')); a.classList.add('on'); }
  });
});

load(true);
</script>
</body>
</html>
